server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # 301 redirects for removed pages
    location = /keyword-strategy-report.md { return 301 /resources; }
    location = /keyword-strategy-report { return 301 /resources; }

    # Consolidate the directly requested static-file alias on the clean tool URL.
    location = /tools/color-palette.html { return 301 /tools/color-palette$is_args$args; }

    # Content-hashed Astro assets are safe to retain indefinitely.
    location ^~ /_astro/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri.html $uri/ =404;
    }

    location ~* \.(js|css|png|jpg|jpeg|gif|ico|svg|webp|avif|woff|woff2|ttf|eot)$ {
        expires 7d;
        add_header Cache-Control "public";
    }
}
